<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>tmax · 你的模型工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到内容</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="tmax 总览"><span class="brand-mark">t<span>↗</span></span><span>tmax<small>MODEL WORKSPACE</small></span></a>
    <div class="workspace-label"><span class="dot"></span>个人工作空间<span class="local-tag">本地</span></div>
    <p class="nav-caption">工作台</p>
    <nav id="navigation" aria-label="主导航"></nav>
    <div class="sidebar-bottom">
      <button class="nav-item" id="advanced"><span id="advanced-icon"></span>高级操作<span class="nav-arrow">↗</span></button>
      <div class="local-note"><span class="dot"></span><div>数据留在你的电脑<small>本地管理 · 无需账户</small></div></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">工作空间<span>/</span><strong id="breadcrumb">总览</strong></div><div class="topbar-actions"><span id="connection" class="connection"><span class="dot"></span>正在连接</span><button class="icon-button" id="refresh" aria-label="刷新本地状态" title="刷新本地状态"></button></div></header>
    <main id="main" tabindex="-1">
      <div class="page-heading"><div><p class="eyebrow" id="eyebrow">YOUR MODEL WORKSPACE</p><h1 id="page-title">总览</h1><p id="page-description">你的模型、服务商和编程工具，在这里连接。</p></div><div id="page-actions" class="actions"></div></div>
      <div id="load-error" role="alert" hidden></div>
      <div id="content" aria-busy="true"><div class="loading">正在读取本地配置…</div></div>
      <footer class="page-footer"><span>tmax · 让模型各就其位</span><span id="updated">读取本地状态，不会自动请求上游服务</span></footer>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><div><p class="eyebrow" id="dialog-eyebrow">WORKSPACE</p><h2 id="dialog-title"></h2></div><button id="dialog-close" class="icon-button" aria-label="关闭">×</button></div>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>请启用 JavaScript 来使用本地工作台。也可以通过 tmax 命令行管理配置。</p></noscript>
</body>
</html>
