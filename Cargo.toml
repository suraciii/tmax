[workspace]
resolver = "2"
members = ["crates/tmax-cli", "crates/tmax-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"
publish = false

[workspace.dependencies]
clap = "4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tmax-core = { path = "crates/tmax-core" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
