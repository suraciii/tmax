name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    name: PR verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install actionlint
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Run PR gate with evidence
        run: just verify-pr "$RUNNER_TEMP/verification"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-verification-evidence
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
